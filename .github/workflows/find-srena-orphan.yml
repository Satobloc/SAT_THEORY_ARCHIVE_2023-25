name: Find SRENA orphan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/find-srena-orphan.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Measure composite SRENA transcript
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          text = Path('SRENA SAT2.txt').read_text(encoding='utf-8-sig')
          marker = text.find('#########')
          start = text.find('{')
          data = json.loads(text[start:marker].strip())
          jmsgs = data.get('messages', [])
          tail = text[marker + len('#########'):]

          pat = re.compile(r'(?m)^\s*(Nathan|Srena)\s*$')
          hits = list(pat.finditer(tail))
          plain = []
          for i, hit in enumerate(hits):
              end = hits[i+1].start() if i+1 < len(hits) else len(tail)
              content = tail[hit.end():end].strip()
              if content:
                  plain.append({'author': hit.group(1), 'content': content})

          print('json_messages=', len(jmsgs))
          print('plain_labeled_messages=', len(plain))
          print('json_createdAt=', data.get('createdAt'))
          print('json_updatedAt=', data.get('updatedAt'))
          print('plain_first_author=', plain[0]['author'] if plain else None)
          print('plain_first=', plain[0]['content'][:140].replace('\n',' ') if plain else None)
          print('plain_last_author=', plain[-1]['author'] if plain else None)
          print('plain_last=', plain[-1]['content'][:220].replace('\n',' ') if plain else None)

          # Find where the labelled transcript begins inside the structured sequence.
          def norm(s):
              return ' '.join((s or '').split()).casefold()
          first = plain[0] if plain else None
          overlap = None
          if first:
              for i, msg in enumerate(jmsgs):
                  if msg.get('author') == first['author'] and norm(msg.get('content')) == norm(first['content']):
                      overlap = i
                      break
          print('plain_starts_at_json_0based=', overlap)
          if overlap is not None:
              merged_count = overlap + len(plain)
              print('merged_messages=', merged_count)
          PY
