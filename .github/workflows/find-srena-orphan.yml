name: Find SRENA orphan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/find-srena-orphan.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Compare SRENA exports
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def extract(path):
              text = Path(path).read_text(encoding='utf-8-sig')
              at = text.find('{')
              if at < 0:
                  raise SystemExit(f'no JSON object in {path}')
              data = json.loads(text[at:])
              msgs = data.get('messages', [])
              print(f'{path}: name={data.get("name")!r}; companion={data.get("companionName")!r}; messages={len(msgs)}; bytes={Path(path).stat().st_size}')
              roles = {}
              authors = {}
              for m in msgs:
                  roles[m.get('role')] = roles.get(m.get('role'), 0) + 1
                  authors[m.get('author')] = authors.get(m.get('author'), 0) + 1
              print(' roles=', roles)
              print(' authors=', authors)
              return data, msgs

          a, am = extract('SRENA SAT.txt')
          b, bm = extract('SRENA SAT2.txt')
          n = min(len(am), len(bm))
          same = 0
          for i in range(n):
              if am[i].get('role') == bm[i].get('role') and am[i].get('author') == bm[i].get('author') and am[i].get('content') == bm[i].get('content'):
                  same += 1
              else:
                  print('first difference at message', i + 1)
                  break
          print(f'identical_prefix_messages={same}/{n}')
          if same == len(am) and len(bm) >= len(am):
              print('RELATION=SRENA SAT.txt is exact prefix of SRENA SAT2.txt')
          elif len(am) == len(bm) and same == len(am):
              print('RELATION=exact duplicates')
          else:
              print('RELATION=overlap but not exact prefix')

          for label, msgs in [('SAT1', am), ('SAT2', bm)]:
              print(label, 'first=', (msgs[0].get('content') or '')[:80].replace('\n',' '))
              print(label, 'last=', (msgs[-1].get('content') or '')[:160].replace('\n',' '))
          PY
