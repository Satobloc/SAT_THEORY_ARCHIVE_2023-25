name: Archive Admin

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  archive-admin:
    if: "!contains(github.event.head_commit.message, '[skip archive-admin]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run archive admin
        run: |
          python '.[⚙️_AI_FILES]/TOOLS/archive_admin.py'

      - name: Commit archive admin results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '..[🎛️_NATHAN_DASH]' '.[⚙️_AI_FILES]' '..findex.txt'
          if git diff --cached --quiet; then
            echo "No archive admin changes to commit."
          else
            git commit -m "Run archive admin [skip archive-admin]"
            git push
          fi
