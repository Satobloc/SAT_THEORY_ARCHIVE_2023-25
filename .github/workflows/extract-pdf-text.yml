name: PDF and Image Text Extract on Request

on:
  push:
    paths:
      - "_AI_REQUESTS/pdf_extract_request.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-text:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PDF extraction and OCR tools
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow
          sudo apt-get update
          sudo apt-get install -y ocrmypdf tesseract-ocr ghostscript

      - name: Extract requested text from PDF or image
        run: |
          python <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          from datetime import datetime, timezone

          import fitz  # PyMuPDF

          request_path = Path("_AI_REQUESTS/pdf_extract_request.json")
          out_root = Path("_AUTO_EXTRACTED_TEXT")
          work_root = Path("_OCR_WORK")

          PDF_EXTENSIONS = {".pdf"}
          IMAGE_EXTENSIONS = {".png", ".jpg", ".jpeg", ".tif", ".tiff", ".bmp", ".webp"}
          SUPPORTED_EXTENSIONS = PDF_EXTENSIONS | IMAGE_EXTENSIONS

          if not request_path.exists():
              print("Request file not found.", file=sys.stderr)
              sys.exit(1)

          request = json.loads(request_path.read_text(encoding="utf-8"))

          # Backward compatible: pdf_path still works. New preferred key is source_path.
          source_path_raw = (
              request.get("source_path")
              or request.get("pdf_path")
              or request.get("image_path")
              or ""
          ).strip()

          request_id = request.get("request_id", "")
          requested_by = request.get("requested_by", "unknown")
          force_ocr = bool(request.get("force_ocr", False))
          ocr_threshold = int(request.get("ocr_threshold", 200))
          language = request.get("ocr_language", "eng")

          if not source_path_raw:
              print("Missing source_path, pdf_path, or image_path in request file.", file=sys.stderr)
              sys.exit(1)

          source_path = Path(source_path_raw)

          # Safety: prevent absolute paths or path traversal.
          if source_path.is_absolute() or ".." in source_path.parts:
              print(f"Unsafe source path: {source_path_raw}", file=sys.stderr)
              sys.exit(1)

          suffix = source_path.suffix.lower()

          if suffix not in SUPPORTED_EXTENSIONS:
              print(f"Unsupported source type: {source_path_raw}", file=sys.stderr)
              print(f"Supported extensions: {sorted(SUPPORTED_EXTENSIONS)}", file=sys.stderr)
              sys.exit(1)

          if not source_path.exists():
              print(f"Source file not found: {source_path_raw}", file=sys.stderr)
              sys.exit(1)

          output_path = out_root / source_path.with_suffix(".txt")
          output_path.parent.mkdir(parents=True, exist_ok=True)
          work_root.mkdir(parents=True, exist_ok=True)

          def extract_pdf_pages(path: Path):
              doc = fitz.open(path)
              pages = []
              for i, page in enumerate(doc, start=1):
                  text = page.get_text("text") or ""
                  pages.append((i, text.strip()))
              return pages

          def count_chars(pages):
              return sum(len(text) for _, text in pages)

          def ocr_pdf(path: Path):
              ocr_pdf_path = work_root / f"{path.stem}.ocr.pdf"
              subprocess.run(
                  [
                      "ocrmypdf",
                      "--skip-text",
                      "--language", language,
                      str(path),
                      str(ocr_pdf_path),
                  ],
                  check=True,
              )
              return ocr_pdf_path

          def ocr_image(path: Path):
              # Tesseract writes output_path without extension, then creates .txt.
              base = work_root / f"{path.stem}.image_ocr"
              subprocess.run(
                  [
                      "tesseract",
                      str(path),
                      str(base),
                      "-l", language,
                  ],
                  check=True,
              )
              text_path = base.with_suffix(".txt")
              text = text_path.read_text(encoding="utf-8", errors="replace") if text_path.exists() else ""
              return [(1, text.strip())]

          extraction_engine = "unknown"
          ocr_attempted = False
          ocr_reason = "not needed"

          if suffix in PDF_EXTENSIONS:
              extraction_engine = "PyMuPDF"
              pages = extract_pdf_pages(source_path)
              char_count = count_chars(pages)

              if force_ocr or char_count < ocr_threshold:
                  ocr_attempted = True
                  ocr_reason = "force_ocr requested" if force_ocr else f"embedded text below threshold ({char_count} < {ocr_threshold})"
                  print(f"OCR fallback triggered: {ocr_reason}")
                  ocr_pdf_path = ocr_pdf(source_path)
                  extraction_engine = "OCRmyPDF + PyMuPDF"
                  pages = extract_pdf_pages(ocr_pdf_path)
                  char_count = count_chars(pages)

          else:
              ocr_attempted = True
              ocr_reason = "image source requires OCR"
              extraction_engine = "Tesseract OCR"
              pages = ocr_image(source_path)
              char_count = count_chars(pages)

          now = datetime.now(timezone.utc).isoformat()

          with output_path.open("w", encoding="utf-8") as f:
              f.write("# Extracted Text\n\n")
              f.write(f"Source file: {source_path.as_posix()}\n")
              f.write(f"Source type: {suffix}\n")
              f.write(f"Request ID: {request_id}\n")
              f.write(f"Requested by: {requested_by}\n")
              f.write(f"Extraction time UTC: {now}\n")
              f.write(f"Extraction engine: {extraction_engine}\n")
              f.write(f"OCR attempted: {ocr_attempted}\n")
              f.write(f"OCR reason: {ocr_reason}\n")
              f.write(f"OCR language: {language}\n")
              f.write(f"Sections/pages: {len(pages)}\n")
              f.write(f"Characters extracted: {char_count}\n\n")
              f.write("---\n\n")

              for page_num, text in pages:
                  label = "Page" if suffix in PDF_EXTENSIONS else "Image"
                  f.write(f"\n\n## {label} {page_num}\n\n")
                  f.write(text)
                  f.write("\n")

          print(f"Wrote {output_path}")
          print(f"Extracted {char_count} characters from {source_path} using {extraction_engine}.")
          PY

      - name: Commit extracted text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _AUTO_EXTRACTED_TEXT/

          if git diff --cached --quiet; then
            echo "No extracted text changes to commit."
          else
            git commit -m "Auto-extract text from request"
            git push
          fi
