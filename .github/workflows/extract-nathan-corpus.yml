name: Extract Nathan Corpus

on:
  workflow_dispatch:
  push:
    paths:
      - '_AI_REQUESTS/nathan_corpus_extract_request.json'
      - '_TOOLS/extract_nathan_corpus.py'
      - '.github/workflows/extract-nathan-corpus.yml'

permissions:
  contents: write

jobs:
  extract-nathan-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Nathan corpus extractor
        run: python _TOOLS/extract_nathan_corpus.py

      - name: Commit generated corpus files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _NATHAN_CORPUS
          if git diff --cached --quiet; then
            echo "No corpus output changes to commit."
          else
            git commit -m "Update Nathan corpus extraction output"
            git push
          fi
