name: FLC auto-digitize field trial

on:
  push:
    paths:
      - '.github/workflows/flc-auto-digitize-test.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flc-auto-digitize-test
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Declare scope
        run: |
          echo "READ: flc/flc1_lo.pdf"
          echo "WRITE: flc/_AUTO_DIGITIZE_TEST/**"
          echo "CLASS: derived/generated output"
          echo "SOURCE PRESERVATION: required"
          echo "QUARANTINE: no quarantine trees read"

      - name: Install digitization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils ocrmypdf ghostscript unpaper tesseract-ocr

      - name: Run field trial
        run: |
          python ".[⚙️_AI_FILES]/TOOLS/flc_auto_digitize.py"             "flc/flc1_lo.pdf"             --out "flc/_AUTO_DIGITIZE_TEST"             --dpi 72

      - name: Validate declared write scope
        shell: bash
        run: |
          set -euo pipefail
          test -s "flc/_AUTO_DIGITIZE_TEST/flc1_lo/manifest.json"
          test -s "flc/_AUTO_DIGITIZE_TEST/flc1_lo/HERE_IS_WHAT_THERE_IS.md"
          python -m json.tool "flc/_AUTO_DIGITIZE_TEST/flc1_lo/manifest.json" >/dev/null
          git diff --name-only HEAD -- flc | grep -v '^flc/_AUTO_DIGITIZE_TEST/' && {
            echo "Unexpected write under flc"; exit 1;
          } || true
          git status --short

      - name: Publish derived trial from fresh base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "flc/_AUTO_DIGITIZE_TEST"
          git diff --cached --quiet && exit 0
          git commit -m "FLC auto-digitize v0 field trial [skip archive-admin]"
          git pull --rebase origin main
          git push origin HEAD:main
