name: flc story feed

on:
  push:
    paths:
      - 'flc/flc1_lo.pdf'
      - 'flc/flc2_lo.pdf'
      - 'flc/flc3_lo.pdf'
      - 'flc/_SITE_FEED/story_catalog.json'
      - 'tools/parse_flc_pages.py'
      - 'tools/reflow_flc_pages.py'
      - 'tools/reflow_flc_pages_v2.py'
      - 'tools/solve_flc_page_order.py'
      - 'tools/apply_flc_story_ranges.py'
      - 'tools/build_flc_story_text_feed.py'
      - '.github/workflows/flc-story-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flc-story-feed-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install page parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils python3-pil

      - name: Parse photographed pages and recover printed order
        shell: bash
        run: |
          set -euo pipefail
          rm -rf flc/_PARSED_TEXT

          python tools/parse_flc_pages.py flc/flc1_lo.pdf --issue-id 01 --catalog flc/_SITE_FEED/story_catalog.json --out flc/_PARSED_TEXT/flc1_lo --dpi 140
          python tools/parse_flc_pages.py flc/flc2_lo.pdf --issue-id 02 --catalog flc/_SITE_FEED/story_catalog.json --out flc/_PARSED_TEXT/flc2_lo --dpi 140
          python tools/parse_flc_pages.py flc/flc3_lo.pdf --issue-id 03 --catalog flc/_SITE_FEED/story_catalog.json --out flc/_PARSED_TEXT/flc3_lo --dpi 140

      - name: Reflow OCR by independent text-block crops
        shell: bash
        run: |
          set -euo pipefail
          python tools/reflow_flc_pages_v2.py flc/flc1_lo.pdf --parsed-dir flc/_PARSED_TEXT/flc1_lo --dpi 180
          python tools/reflow_flc_pages_v2.py flc/flc2_lo.pdf --parsed-dir flc/_PARSED_TEXT/flc2_lo --dpi 180
          python tools/reflow_flc_pages_v2.py flc/flc3_lo.pdf --parsed-dir flc/_PARSED_TEXT/flc3_lo --dpi 180

      - name: Solve printed-page assignments conservatively
        shell: bash
        run: |
          set -euo pipefail
          python tools/solve_flc_page_order.py --catalog flc/_SITE_FEED/story_catalog.json --issue-id 01 --parsed-dir flc/_PARSED_TEXT/flc1_lo
          python tools/solve_flc_page_order.py --catalog flc/_SITE_FEED/story_catalog.json --issue-id 02 --parsed-dir flc/_PARSED_TEXT/flc2_lo
          python tools/solve_flc_page_order.py --catalog flc/_SITE_FEED/story_catalog.json --issue-id 03 --parsed-dir flc/_PARSED_TEXT/flc3_lo

      - name: Apply source-reviewed printed story ranges
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_flc_story_ranges.py --catalog flc/_SITE_FEED/story_catalog.json --issue-id 01 --parsed-dir flc/_PARSED_TEXT/flc1_lo
          python tools/apply_flc_story_ranges.py --catalog flc/_SITE_FEED/story_catalog.json --issue-id 02 --parsed-dir flc/_PARSED_TEXT/flc2_lo
          python tools/apply_flc_story_ranges.py --catalog flc/_SITE_FEED/story_catalog.json --issue-id 03 --parsed-dir flc/_PARSED_TEXT/flc3_lo

      - name: Build story feed
        run: python tools/build_flc_story_text_feed.py

      - name: Validate feed and parser outputs
        run: |
          python -m json.tool flc/_SITE_FEED/latest.json >/dev/null
          python -m json.tool flc/_SITE_FEED/story-index.json >/dev/null
          for stem in flc1_lo flc2_lo flc3_lo; do
            python -m json.tool "flc/_PARSED_TEXT/$stem/manifest.json" >/dev/null
            python -m json.tool "flc/_PARSED_TEXT/$stem/story-text-index.json" >/dev/null
            python -m json.tool "flc/_PARSED_TEXT/$stem/PAGE_ORDER_SOLVER_REPORT.json" >/dev/null
            test -f "flc/_PARSED_TEXT/$stem/TEXT_REFLOW_REPORT.md"
          done

      - name: Publish derived page text and story feed safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/flc-publish
          mkdir -p /tmp/flc-publish/site
          cp -a flc/_PARSED_TEXT /tmp/flc-publish/_PARSED_TEXT
          cp -a flc/_SITE_FEED/stories /tmp/flc-publish/site/stories
          cp flc/_SITE_FEED/latest.json /tmp/flc-publish/site/latest.json
          cp flc/_SITE_FEED/story-index.json /tmp/flc-publish/site/story-index.json

          for attempt in 1 2 3; do
            echo "publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            rm -rf flc/_PARSED_TEXT flc/_SITE_FEED/stories
            cp -a /tmp/flc-publish/_PARSED_TEXT flc/_PARSED_TEXT
            cp -a /tmp/flc-publish/site/stories flc/_SITE_FEED/stories
            cp /tmp/flc-publish/site/latest.json flc/_SITE_FEED/latest.json
            cp /tmp/flc-publish/site/story-index.json flc/_SITE_FEED/story-index.json

            git add flc/_PARSED_TEXT
            git add flc/_SITE_FEED/latest.json flc/_SITE_FEED/story-index.json flc/_SITE_FEED/stories
            if git diff --cached --quiet; then
              echo "derived feed already current"
              exit 0
            fi

            git commit -m "Refresh block-reflowed flc story text [skip archive-admin]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during publish; retrying from fresh origin/main"
          done

          echo "failed to publish derived feed after 3 attempts" >&2
          exit 1
