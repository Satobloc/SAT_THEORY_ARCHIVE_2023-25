name: flc story feed

on:
  push:
    paths:
      - 'flc/flc1_lo.pdf'
      - 'flc/flc2_lo.pdf'
      - 'flc/flc3_lo.pdf'
      - 'flc/_SITE_FEED/story_catalog.json'
      - 'tools/parse_flc_spreads.py'
      - 'tools/build_flc_story_text_feed.py'
      - '.github/workflows/flc-story-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install spread parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Parse photographed spreads into logical pages
        shell: bash
        run: |
          set -euo pipefail
          python tools/parse_flc_spreads.py \
            flc/flc1_lo.pdf \
            --issue-id 01 \
            --catalog flc/_SITE_FEED/story_catalog.json \
            --out flc/_PARSED_TEXT/flc1_lo \
            --dpi 100

          python tools/parse_flc_spreads.py \
            flc/flc2_lo.pdf \
            --issue-id 02 \
            --catalog flc/_SITE_FEED/story_catalog.json \
            --out flc/_PARSED_TEXT/flc2_lo \
            --dpi 100

          python tools/parse_flc_spreads.py \
            flc/flc3_lo.pdf \
            --issue-id 03 \
            --catalog flc/_SITE_FEED/story_catalog.json \
            --out flc/_PARSED_TEXT/flc3_lo \
            --dpi 100

      - name: Build story feed
        run: python tools/build_flc_story_text_feed.py

      - name: Validate feed and parser outputs
        run: |
          python -m json.tool flc/_SITE_FEED/latest.json >/dev/null
          python -m json.tool flc/_SITE_FEED/story-index.json >/dev/null
          for stem in flc1_lo flc2_lo flc3_lo; do
            python -m json.tool "flc/_PARSED_TEXT/$stem/manifest.json" >/dev/null
            python -m json.tool "flc/_PARSED_TEXT/$stem/story-text-index.json" >/dev/null
          done

      - name: Publish derived logical text and story feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flc/_PARSED_TEXT
          git add flc/_SITE_FEED/latest.json flc/_SITE_FEED/story-index.json flc/_SITE_FEED/stories
          git diff --cached --quiet && exit 0
          git commit -m "Refresh spread-aware flc story text [skip archive-admin]"
          git pull --rebase origin main
          git push origin HEAD:main
